<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#161222"/>
      <stop offset="40%" stop-color="#0b0a14"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(171,134,185,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="regionGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(171,134,185,0.10)"/>
      <stop offset="100%" stop-color="rgba(171,134,185,0)"/>
    </radialGradient>
    <radialGradient id="regionGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.08)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
    <radialGradient id="regionGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(91,192,190,0.07)"/>
      <stop offset="100%" stop-color="rgba(91,192,190,0)"/>
    </radialGradient>
  </defs>
  
  <rect width="1440" height="900" fill="url(#bgGlow)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  
  <!-- Terrain region blobs -->
  <ellipse cx="220" cy="720" rx="220" ry="160" fill="url(#regionGlow1)"/>
  <ellipse cx="450" cy="620" rx="180" ry="140" fill="url(#regionGlow2)"/>
  <ellipse cx="380" cy="320" rx="200" ry="160" fill="url(#regionGlow3)"/>
  <ellipse cx="720" cy="420" rx="260" ry="200" fill="url(#regionGlow1)"/>
  <ellipse cx="1050" cy="280" rx="240" ry="180" fill="url(#regionGlow2)"/>
  <ellipse cx="1200" cy="650" rx="200" ry="150" fill="url(#regionGlow3)"/>
  
  <!-- Decorative constellation lines -->
  <g stroke="rgba(171,134,185,0.12)" stroke-width="1" fill="none">
    <path d="M120 140 L340 80 L560 200 L900 120"/>
    <path d="M150 350 L420 500 L800 700"/>
    <path d="M650 100 L1100 300 L1300 100"/>
    <path d="M1000 800 L1250 650"/>
  </g>
  
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="340" cy="80" r="0.8" opacity="0.4"/>
    <circle cx="560" cy="200" r="1" opacity="0.45"/>
    <circle cx="900" cy="120" r="0.9" opacity="0.4"/>
    <circle cx="1100" cy="300" r="1.1" opacity="0.5"/>
    <circle cx="1300" cy="100" r="0.7" opacity="0.35"/>
    <circle cx="150" cy="350" r="0.9" opacity="0.4"/>
    <circle cx="420" cy="500" r="0.8" opacity="0.35"/>
    <circle cx="800" cy="700" r="1" opacity="0.45"/>
    <circle cx="1250" cy="650" r="0.9" opacity="0.4"/>
    <circle cx="1000" cy="800" r="0.8" opacity="0.35"/>
    <circle cx="650" cy="100" r="0.7" opacity="0.3"/>
    <circle cx="250" cy="600" r="0.6" opacity="0.35"/>
    <circle cx="700" cy="250" r="0.9" opacity="0.4"/>
    <circle cx="950" cy="450" r="0.7" opacity="0.3"/>
  </g>
  
  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="rgba(5,5,8,0)"/>
    <stop offset="100%" stop-color="rgba(5,5,8,0.75)"/>
  </radialGradient>
  <rect width="1440" height="900" fill="url(#vignette)"/>
</svg>