<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="lockedOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(107,114,128,0.30)"/>
      <stop offset="100%" stop-color="rgba(107,114,128,0)"/>
    </radialGradient>
    <linearGradient id="lockedBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#13131F"/>
    </linearGradient>
    <linearGradient id="lockedSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
  </defs>
  
  <circle cx="50" cy="50" r="46" fill="url(#lockedOuterGlow)"/>
  <circle cx="50" cy="50" r="38" fill="url(#lockedBody)" stroke="#6B7280" stroke-width="3" stroke-dasharray="8,5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>
  
  <!-- Lock -->
  <g transform="translate(50, 52)">
    <!-- Chain arcs -->
    <path d="M-22,-10 Q-28,-28 0,-32 Q28,-28 22,-10" fill="none" stroke="#6B7280" stroke-width="3" stroke-dasharray="5,3"/>
    
    <!-- Lock body -->
    <rect x="-16" y="-10" width="32" height="26" rx="4" fill="url(#lockedSilver)" stroke="#4B5563" stroke-width="1.5"/>
    
    <!-- Lock shackle -->
    <path d="M-10,-10 L-10,-20 Q-10,-28 0,-28 Q10,-28 10,-20 L10,-10" fill="none" stroke="url(#lockedSilver)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="0" r="4" fill="#13131F"/>
    <path d="M-2,0 L2,0 L1,10 L-1,10 Z" fill="#13131F"/>
  </g>
</svg>