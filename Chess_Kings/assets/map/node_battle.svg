<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="battleOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.40)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
    <linearGradient id="battleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#13131F"/>
    </linearGradient>
    <linearGradient id="battleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D878"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  
  <circle cx="50" cy="50" r="46" fill="url(#battleOuterGlow)"/>
  <circle cx="50" cy="50" r="38" fill="url(#battleBody)" stroke="#D4AF37" stroke-width="3"/>
  
  <!-- Crossed swords -->
  <g transform="translate(50, 52) rotate(45)" fill="none" stroke="url(#battleGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sword 1 -->
    <path d="M-4,-22 L4,-22 L2,-6 L18,-10 L20,-2 L2,4 L8,20 L0,22 L-6,6 L-20,12 L-22,4 L-6,-2 Z"/>
    <circle cx="0" cy="0" r="4" fill="#13131F" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- Sword 2 (crossed) -->
    <g transform="rotate(90)">
      <path d="M-4,-22 L4,-22 L2,-6 L18,-10 L20,-2 L2,4 L8,20 L0,22 L-6,6 L-20,12 L-22,4 L-6,-2 Z"/>
      <circle cx="0" cy="0" r="4" fill="#13131F" stroke="#D4AF37" stroke-width="2"/>
    </g>
  </g>
</svg>